name: Build and Release

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - next
    tags:
      - '*'
  pull_request:
    branches-ignore:
      - next
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PROJECT_PATH: llcom plus\llcom plus.csproj
      SOLUTION_PATH: llcom plus.sln
      RELEASE_ARTIFACT_DIR: artifacts\release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "${{ env.SOLUTION_PATH }}"

      - name: Clean release artifacts
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "${{ env.RELEASE_ARTIFACT_DIR }}" -ErrorAction SilentlyContinue

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc --toolchain 1.82.0
          cargo +1.82.0 --version
          rustc +1.82.0 --version

      - name: Build x64 and x86 native monitor from source
        shell: pwsh
        run: |
          .\serial_monitor_rs\build.ps1 -Config Release -Arch All -RustToolchain 1.82.0

      - name: Build x64
        run: msbuild "${{ env.PROJECT_PATH }}" /p:Configuration=Release /p:Platform=x64 /p:RequireNativeSourceBuild=true /v:normal

      - name: Build x86
        run: msbuild "${{ env.PROJECT_PATH }}" /p:Configuration=Release /p:Platform=x86 /p:RequireNativeSourceBuild=true /v:normal

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llcom-plus-release
          path: artifacts/release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_ARTIFACT_DIR: artifacts\release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: llcom-plus-release
          path: artifacts/release

      - name: Sign release artifacts
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_XML: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_XML }}
        run: |
          .\build\Sign-Release.ps1 -ArtifactsDirectory "${{ env.RELEASE_ARTIFACT_DIR }}" -Version "${{ github.ref_name }}"

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path temp
          Copy-Item "${{ env.RELEASE_ARTIFACT_DIR }}\*.zip" temp\
          Copy-Item "${{ env.RELEASE_ARTIFACT_DIR }}\*.zip.sig" temp\
          Copy-Item changlog\index.html temp\changelog.html
          Copy-Item changlog\autoUpdate.xml temp\autoUpdate.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            artifacts/release/*.zip
            artifacts/release/*.zip.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to COS
        shell: pwsh
        env:
          COS_A: ${{ secrets.COS_A }}
          COS_S: ${{ secrets.COS_S }}
          COS_B: ${{ secrets.COS_B }}
          COS_R: ${{ secrets.COS_R }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COS_A) -or
              [string]::IsNullOrWhiteSpace($env:COS_S) -or
              [string]::IsNullOrWhiteSpace($env:COS_B) -or
              [string]::IsNullOrWhiteSpace($env:COS_R)) {
            Write-Host 'COS credentials are not configured; skipping mirror upload.'
            exit 0
          }
          python -m pip install coscmd==1.8.6.31
          coscmd config -a $env:COS_A -s $env:COS_S -b $env:COS_B -r $env:COS_R
          coscmd upload temp/ / -r
