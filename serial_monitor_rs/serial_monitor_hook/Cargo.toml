[package]
name = "serial_monitor_hook"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "serial_monitor_hook"

[dependencies]

# Exact pin: retour 0.3.1 provides instruction decoding/relocation-backed x64
# GenericDetour on stable Rust. x86 uses vendored MinHook with thread-IP
# relocation; neither architecture uses a fixed-length handwritten patch.
[target.'cfg(target_arch = "x86_64")'.dependencies]
retour = "=0.3.1"

[build-dependencies]
cc = "=1.4.4"

# Exact pin: windows 0.58.0 supplies the Win32 ABI bindings used by the hook.
[dependencies.windows]
version = "=0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]
