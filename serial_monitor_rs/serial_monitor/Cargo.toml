[package]
name = "serial_monitor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "serial_monitor"

[dependencies]

# Exact pin: windows 0.58.0 supplies the Win32 bindings used by the host.
[dependencies.windows]
version = "=0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_System_SystemServices",
]

[build-dependencies]
